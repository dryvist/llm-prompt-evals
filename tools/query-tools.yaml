- type: function
  function:
    name: metrics_query
    description: Run a read-only query against a synthetic metrics fixture.
    strict: true
    parameters:
      type: object
      properties:
        dialect:
          type: string
          enum: [promql, metricsql]
        query:
          type: string
        start:
          type: string
        end:
          type: string
        step:
          type: string
      required: [dialect, query, start, end, step]
      additionalProperties: false
- type: function
  function:
    name: logs_query
    description: Run a bounded read-only LogsQL query against a synthetic log fixture.
    strict: true
    parameters:
      type: object
      properties:
        dialect:
          type: string
          enum: [logsql]
        query:
          type: string
        start:
          type: string
        end:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required: [dialect, query, start, end, limit]
      additionalProperties: false
- type: function
  function:
    name: clickhouse_read
    description: Run a read-only SELECT against a synthetic ClickHouse fixture.
    strict: true
    parameters:
      type: object
      properties:
        query:
          type: string
      required: [query]
      additionalProperties: false
- type: function
  function:
    name: graphql_read
    description: Run a read-only GraphQL query against a synthetic fixture.
    strict: true
    parameters:
      type: object
      properties:
        service:
          type: string
        query:
          type: string
        variables:
          type: object
      required: [service, query, variables]
      additionalProperties: false
- type: function
  function:
    name: rest_read
    description: Run an HTTP GET against a synthetic REST fixture.
    strict: true
    parameters:
      type: object
      properties:
        method:
          type: string
          enum: [GET]
        path:
          type: string
        query:
          type: object
      required: [method, path, query]
      additionalProperties: false
- type: function
  function:
    name: gh_read
    description: Read owner-scoped repository data from a synthetic forge fixture.
    strict: true
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        resource:
          type: string
        filters:
          type: object
      required: [owner, repo, resource, filters]
      additionalProperties: false
