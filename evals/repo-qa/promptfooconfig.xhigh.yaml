# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Pinned-repository knowledge evaluation with deterministic assertions, highest reasoning effort

prompts:
  - |-
    Answer only from the supplied repository context. Return a short, exact
    answer. If the evidence is missing, say UNVERIFIED.
    Repository context:
    {{ context }}
    Question: {{ question }}

providers:
  - id: openai:chat:{{ env.LITELLM_MODEL }}
    config:
      apiBaseUrl: "{{ env.LITELLM_BASE_URL }}"
      apiKeyEnvar: LITELLM_API_KEY
      max_tokens: 16384
      temperature: 0
      passthrough:
        chat_template_kwargs:
          reasoning_effort: xhigh

tests: file://.generated/cases.jsonl

defaultTest:
  vars:
    reasoning_effort: xhigh
