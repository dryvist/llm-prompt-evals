description: Candidate versus baseline evaluation on Langfuse holdout items only

prompts:
  - file://{{ env.HELDOUT_BASELINE_PROMPT }}
  - file://{{ env.HELDOUT_CANDIDATE_PROMPT }}

providers: file://../../providers/router.yaml

tests:
  - file://heldout.py:generate_tests

defaultTest:
  options:
    provider:
      id: openai:chat:small
      config:
        apiBaseUrl: "{{ env.LLM_ROUTER_BASE_URL | default('http://llm-router-unset.invalid/v1', true) }}"
        apiKeyEnvar: LLM_ROUTER_API_KEY
        temperature: 0

sharing: false
